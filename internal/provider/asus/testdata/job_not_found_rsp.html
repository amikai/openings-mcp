<!-- app main scripts -->
<script>
    // 通用的輸入字符計數功能
    var InputLengthHelper = {
        // 初始化字符計數器
        init: function (inputName, counterId, maxLength) {
            if (!inputName || !counterId || !maxLength) {
                console.warn('InputLengthHelper.init: 缺少必要參數');
                return;
            }

            var input = $('input[name="' + inputName + '"]');
            if (input.length > 0) {
                // 設置 maxlength 屬性
                input.attr('maxlength', maxLength);

                // 移除現有的事件監聽器以避免重複綁定
                input.off('input.lengthHelper');

                // 綁定 input 事件來更新計數
                input.on('input.lengthHelper', function () {
                    InputLengthHelper.updateCount(this, counterId, maxLength);
                });

                // 初始化計數顯示
                InputLengthHelper.updateCount(input[0], counterId, maxLength);
            } else {
                console.warn('InputLengthHelper.init: 找不到輸入框 ' + inputName);
            }
        },

        // 更新字符計數顯示
        updateCount: function (inputElement, counterId, maxLength) {
            if (!inputElement || !counterId) {
                return;
            }

            var currentLength = inputElement.value.length;
            var counter = $('#' + counterId);
            if (counter.length > 0) {
                counter.text(currentLength + '/' + maxLength);
            }
        },

        // 批量初始化多個字符計數器
        initMultiple: function (configs) {
            if (!Array.isArray(configs)) {
                console.warn('InputLengthHelper.initMultiple: 參數必須是陣列');
                return;
            }

            configs.forEach(function (config) {
                if (config.inputName && config.counterId && config.maxLength) {
                    InputLengthHelper.init(config.inputName, config.counterId, config.maxLength);
                }
            });
        },

        // 自動初始化所有帶有 input-length-counter 類別的元素
        autoInit: function () {
            $('.input-length-counter:not(.initialized)').each(function () {
                var $counter = $(this);
                var inputName = $counter.data('input-name');
                var maxLength = $counter.data('max-length');
                var counterId = $counter.attr('id');

                if (inputName && maxLength && counterId) {
                    InputLengthHelper.init(inputName, counterId, maxLength);
                    $counter.addClass('initialized'); // 標記為已初始化
                }
            });
        },

        // 設置 DOM 變化監聽器
        setupMutationObserver: function () {
            if (typeof MutationObserver !== 'undefined') {
                var observer = new MutationObserver(function (mutations) {
                    var shouldAutoInit = false;
                    mutations.forEach(function (mutation) {
                        if (mutation.type === 'childList') {
                            mutation.addedNodes.forEach(function (node) {
                                if (node.nodeType === 1) { // Element node
                                    var $node = $(node);
                                    if ($node.hasClass('input-length-counter') || $node.find('.input-length-counter').length > 0) {
                                        shouldAutoInit = true;
                                    }
                                }
                            });
                        }
                    });

                    if (shouldAutoInit) {
                        setTimeout(function () {
                            InputLengthHelper.autoInit();
                        }, 100);
                    }
                });

                observer.observe(document.body, {
                    childList: true,
                    subtree: true
                });
            }
        }
    };

    // 頁面加載完成後自動初始化
    $(document).ready(function () {
        InputLengthHelper.autoInit();
        InputLengthHelper.setupMutationObserver();
    });
</script>
