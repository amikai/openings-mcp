# Curated Dayforce (Ceridian) candidate portal boards. Each entry was
# verified live: POST /api/geo/{namespace}/jobposting/search returns HTTP 200
# with maxCount > 0 for the given job_board_code.
# culture_code is optional and defaults to en-US — an unsupported culture
# returns 200 with an empty board rather than an error, so it must be pinned
# per tenant rather than guessed.
# Slugs and display names may collide with other ATS rosters; Resolve
# disambiguates that at runtime instead of NewRegistry failing at startup.
# Two rules stay fatal at startup: no two entries in this file may share a
# slug or a display name, and an entry whose adapter cannot render a careers
# URL must have a display name colliding with no other entry's name or slug
# anywhere — that name is its only disambiguation key. Comparison folds case
# and punctuation, so "Foo Inc." and "foo inc" are the same name.

